<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - CineBook</title>
    <meta name="description" content="Your ticket booking is confirmed.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body { padding-top: 80px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at top, #1a1a2e 0%, #000000 100%); }
        .success-header { text-align: center; margin-bottom: 2rem; animation: slideDown 0.5s ease; }
        .success-icon { width: 80px; height: 80px; background: #00c851; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1rem; box-shadow: 0 0 30px rgba(0,200,81,0.5); }
        
        .ticket-card { width: 100%; max-width: 450px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 10; animation: scaleIn 0.5s ease 0.2s both; }
        .ticket-card::before, .ticket-card::after { content: ''; position: absolute; top: 120px; width: 30px; height: 30px; background: #000; border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,1); }
        .ticket-card::before { left: -15px; }
        .ticket-card::after { right: -15px; }
        
        .ticket-header { padding: 1.5rem; display: flex; gap: 1rem; }
        .ticket-header img { width: 80px; height: 120px; object-fit: cover; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .ticket-title { font-size: 1.5rem; margin: 0 0 0.2rem 0; font-family: 'Outfit', sans-serif; }
        .ticket-theater { color: var(--text-muted); font-size: 0.9rem; }
        
        .ticket-divider { border-top: 2px dashed rgba(255,255,255,0.2); margin: 0 1.5rem; }
        
        .ticket-details { padding: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .detail-item p { margin: 0 0 0.2rem 0; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .detail-item h4 { margin: 0; font-size: 1.1rem; }
        
        .ticket-qr { padding: 1.5rem; text-align: center; background: rgba(255,255,255,0.05); }
        #qrcode { background: white; padding: 10px; border-radius: 8px; display: inline-block; margin-bottom: 1rem; }
        .ticket-id { font-family: monospace; font-size: 1.2rem; letter-spacing: 2px; color: var(--primary); font-weight: bold; }
        
        .actions { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-top: 2rem; max-width: 500px; animation: fadeIn 0.5s ease 0.5s both; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; text-align: center; }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-outline { background: transparent; color: white; border: 1px solid white; }
        .btn-ghost { background: transparent; color: var(--text-muted); border: none; }
        
        /* Confetti */
        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 50%; z-index: 1; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        @media print {
            body { background: white; color: black; padding: 0; display: block; }
            .navbar, .actions, .success-header { display: none; }
            .ticket-card { box-shadow: none; border: 1px solid #ccc; max-width: 100%; margin: 2rem auto; filter: none; }
            * { color: black !important; text-shadow: none !important; background: transparent !important; }
            .ticket-card::before, .ticket-card::after { display: none; }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><i class="fas fa-film"></i><span>CineBook</span></a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="success-header">
        <div class="success-icon"><i class="fas fa-check"></i></div>
        <h2>Booking Confirmed!</h2>
        <p>Your tickets have been sent to your email.</p>
    </div>
    
    <div class="ticket-card" id="ticketCard">
        <div class="ticket-header">
            <img id="tktPoster" src="" alt="">
            <div>
                <h3 class="ticket-title" id="tktMovieTitle">--</h3>
                <p class="ticket-theater" id="tktTheater"><i class="fas fa-map-marker-alt"></i> --</p>
                <div style="margin-top: 1rem; display:inline-block; padding:0.2rem 0.5rem; background:#00c851; color:white; border-radius:4px; font-size:0.8rem; font-weight:bold;">CONFIRMED</div>
            </div>
        </div>
        <div class="ticket-divider"></div>
        <div class="ticket-details">
            <div class="detail-item">
                <p>Date</p>
                <h4 id="tktDate">--</h4>
            </div>
            <div class="detail-item">
                <p>Time</p>
                <h4 id="tktTime">--</h4>
            </div>
            <div class="detail-item">
                <p>Screen</p>
                <h4>Screen 1</h4>
            </div>
            <div class="detail-item">
                <p>Seats (<span id="tktCount">0</span>)</p>
                <h4 id="tktSeats">--</h4>
            </div>
            <div class="detail-item">
                <p>Amount Paid</p>
                <h4 id="tktAmount">--</h4>
            </div>
        </div>
        <div class="ticket-divider"></div>
        <div class="ticket-qr">
            <div id="qrcode"></div>
            <div class="ticket-id" id="tktId">--</div>
        </div>
    </div>
    
    <div class="actions">
        <button class="btn btn-primary" id="btnDownload"><i class="fas fa-download"></i> Download Ticket</button>
        <button class="btn btn-outline" id="btnPrint"><i class="fas fa-print"></i> Print</button>
        <a href="index.html" class="btn btn-ghost">Book Another</a>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/qr.js"></script>
    <script src="js/ticket.js"></script>
</body>
</html>
