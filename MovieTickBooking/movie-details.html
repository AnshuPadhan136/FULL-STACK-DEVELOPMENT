<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - CineBook</title>
    <meta name="description" content="View movie details and book tickets.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/cards.css">
    <style>
        .movie-banner {
            position: relative;
            width: 100%;
            height: 50vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
        }
        .movie-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-main) 0%, transparent 100%), 
                        linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 100%);
            backdrop-filter: blur(5px);
        }
        .movie-content-area {
            position: relative;
            z-index: 10;
            margin-top: -150px;
            padding-bottom: 3rem;
        }
        .movie-detail-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 3rem;
            align-items: start;
        }
        .movie-poster-large {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .movie-info h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-family: 'Outfit', sans-serif;
        }
        .movie-meta-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .movie-meta-bar span { display: flex; align-items: center; gap: 0.5rem; }
        .rating-stars { color: #f5c518; }
        .movie-synopsis {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            color: var(--text-secondary);
        }
        .cast-crew { margin-bottom: 2rem; }
        .cast-crew h3 { margin-bottom: 1rem; }
        .cast-list {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
        }
        .cast-item {
            text-align: center;
            min-width: 80px;
        }
        .cast-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
            font-size: 1.5rem;
            color: var(--text-muted);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .action-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .favorite-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .favorite-btn:hover { background: rgba(255,255,255,0.2); }
        .favorite-btn.active { color: #ff4757; }
        
        .reviews-section { margin-top: 3rem; }
        .review-card {
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 768px) {
            .movie-detail-grid { grid-template-columns: 1fr; gap: 2rem; }
            .movie-poster-large { max-width: 250px; margin: 0 auto; display: block; }
            .movie-info { text-align: center; }
            .movie-meta-bar { justify-content: center; }
            .action-buttons { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingScreen">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><i class="fas fa-film"></i><span>CineBook</span></a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="movies.html" class="nav-link">Movies</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="faq.html" class="nav-link">FAQ</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
                <a href="profile.html" class="nav-user" aria-label="User profile"><i class="fas fa-user-circle"></i></a>
                <button class="nav-hamburger" id="navHamburger" aria-label="Menu"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <div id="movieDetailContent">
        <!-- Rendered by movies.js -->
    </div>

    <!-- Similar Movies Section -->
    <section class="container" style="margin-top: 4rem; margin-bottom: 4rem;">
        <h2>You May Also Like</h2>
        <div class="movie-grid mt-3" id="similarMoviesGrid">
            <!-- Injected dynamically -->
        </div>
    </section>

    <!-- Trailer Modal -->
    <div class="trailer-modal" id="trailerModal">
        <div class="trailer-content">
            <button class="close-trailer" id="closeTrailer"><i class="fas fa-times"></i></button>
            <div class="iframe-container">
                <iframe id="trailerIframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-grid">
                <div class="footer-col">
                    <a href="index.html" class="footer-logo"><i class="fas fa-film"></i> CineBook</a>
                    <p class="footer-desc">Your ultimate destination for movie ticket booking.</p>
                </div>
            </div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="fas fa-chevron-up"></i></button>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/app.js"></script>
    
    <script src="js/search.js"></script>
    <script src="js/movies.js"></script>
</body>
</html>
