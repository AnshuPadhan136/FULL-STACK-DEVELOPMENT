<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Friend Request</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#7d86bf,#7d86bf,#7d86bf);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:380px;
    background:white;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* Circular Profile Picture */
.profile{
    display:flex;
    justify-content:center;
    margin-bottom:15px;
}

.profile img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #30e1a3;
}

/* Name */
h2{
    margin-top:10px;
    color:#222;
}

/* Username Rectangle */
.username-box{
    display:inline-block;
    margin-top:12px;
    padding:10px 30px;
    border:2px solid #dcafbe;
    border-radius:10px;
    background:linear-gradient(45deg,#d5bae6,#d5bae6);
    color:white;
    font-size:16px;
    font-weight:bold;
    letter-spacing:1px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* Bio */
.bio{
    margin-top:18px;
    font-size:15px;
    color:#444;
    line-height:1.6;
}

/* Statistics */
.stats{
    display:flex;
    justify-content:space-around;
    margin-top:25px;
}

.stats div{
    text-align:center;
}

.stats h3{
    color:#E1306C;
    margin-bottom:5px;
}

.stats p{
    color:#555;
}

/* Friend Request Box */
.request{
    background:#f5f5f5;
    margin-top:25px;
    padding:18px;
    border-radius:12px;
}

.request h3{
    margin-bottom:15px;
}

button{
    padding:10px 22px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:15px;
    cursor:pointer;
    margin:8px;
    transition:0.3s;
}

.accept{
    background:#2848a7;
}

.reject{
    background:#dc7d35;
}

button:hover{
    transform:scale(1.05);
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

#status{
    margin-top:18px;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

    <!-- Circular Profile Picture -->
    <div class="profile">
        <img src="IMG-20260620-WA0006.jpg" alt="Profile Picture" class="black-dp">
    </div>

    <!-- Name -->
    <h2>Anshu</h2>

    <!-- Username in Rectangle -->
    <div class="username-box">
        @anshupadhan
    </div>




    <!-- Friend Request -->
    <div class="request">

        <h3> Friend Request</h3>

        <button class="accept" onclick="acceptRequest()">
            ✔ Accept
        </button>

        <button class="reject" onclick="rejectRequest()">
            ✖ Reject
        </button>

        <div id="status">
            Waiting for your response...
        </div>

    </div>

</div>

<script>

function acceptRequest(){

    document.getElementById("status").innerHTML =
    " Friend Request Accepted";

    document.getElementById("status").style.color = "green";

    document.querySelector(".accept").disabled = true;
    document.querySelector(".reject").disabled = true;
}

function rejectRequest(){

    document.getElementById("status").innerHTML =
    "Friend Request Rejected";

    document.getElementById("status").style.color = "red";

    document.querySelector(".accept").disabled = true;
    document.querySelector(".reject").disabled = true;
}

</script>

</body>
</html>
