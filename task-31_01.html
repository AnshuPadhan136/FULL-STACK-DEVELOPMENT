<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f7;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:240px;
background:#1e293b;
color:white;
padding:20px;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:15px;
margin:8px 0;
background:#334155;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.sidebar li:hover{
background:#3b82f6;
}

.main{
flex:1;
padding:30px;
}

.header{
background:white;
padding:20px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
color:#3b82f6;
margin-bottom:10px;
}

.section{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 5px 10px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

table th,table td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

.progress{
background:#ddd;
height:10px;
border-radius:20px;
overflow:hidden;
}

.bar{
height:10px;
background:#3b82f6;
}

.profile{
display:flex;
align-items:center;
gap:20px;
}

.avatar{
width:80px;
height:80px;
border-radius:50%;
background:#3b82f6;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
color:white;
}

@media(max-width:768px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
}

.profile{
flex-direction:column;
text-align:center;
}
}
</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function App(){

const courses=[
{name:"Mathematics",teacher:"Mr. Sharma"},
{name:"Physics",teacher:"Mrs. Das"},
{name:"Computer Science",teacher:"Dr. Rao"},
{name:"English",teacher:"Mrs. Patel"}
];

const assignments=[
{title:"Math Assignment",due:"5 Aug"},
{title:"Physics Lab Report",due:"7 Aug"},
{title:"React Project",due:"12 Aug"}
];

const marks=[
{subject:"Math",mark:95},
{subject:"Physics",mark:91},
{subject:"Computer",mark:98},
{subject:"English",mark:87}
];

return(

<div className="container">

<div className="sidebar">
<h2>🎓 Student Portal</h2>

<ul>
<li>Dashboard</li>
<li>Profile</li>
<li>Courses</li>
<li>Attendance</li>
<li>Assignments</li>
<li>Results</li>
<li>Settings</li>
</ul>

</div>

<div className="main">

<div className="header">
<h2>Welcome, Anshu Padhan 👋</h2>
<h3>Roll No: 24CSEAIML136</h3>
</div>

<div className="cards">

<div className="card">
<h3>Courses</h3>
<h1>4</h1>
</div>

<div className="card">
<h3>Attendance</h3>
<h1>81%</h1>
</div>

<div className="card">
<h3>Assignments</h3>
<h1>3</h1>
</div>

<div className="card">
<h3>CGPA</h3>
<h1>9.0</h1>
</div>

</div>

<div className="section">

<h2>Student Profile</h2>

<div className="profile">

<div className="avatar">
👨
</div>

<div>
<h3>John Doe</h3>
<p>Bachelor of Computer Science</p>
<p>Email: anshupadhan@gmail.com</p>
<p>Phone: +91 9692039124</p>
</div>

</div>

</div>

<div className="section">

<h2>My Courses</h2>

<table>

<thead>

<tr>
<th>Course</th>
<th>Teacher</th>
</tr>

</thead>

<tbody>

{
courses.map((c,index)=>

<tr key={index}>
<td>{c.name}</td>
<td>{c.teacher}</td>
</tr>

)
}

</tbody>

</table>

</div>

<div className="section">

<h2>Attendance</h2>

<p>Overall Attendance: 92%</p>

<div className="progress">
<div className="bar" style={{width:"92%"}}></div>
</div>

</div>

<div className="section">

<h2>Assignments</h2>

<table>

<thead>
<tr>
<th>Assignment</th>
<th>Due Date</th>
</tr>
</thead>

<tbody>

{
assignments.map((a,index)=>

<tr key={index}>
<td>{a.title}</td>
<td>{a.due}</td>
</tr>

)
}

</tbody>

</table>

</div>

<div className="section">

<h2>Marks</h2>

<table>

<thead>

<tr>
<th>Subject</th>
<th>Marks</th>
</tr>

</thead>

<tbody>

{
marks.map((m,index)=>

<tr key={index}>
<td>{m.subject}</td>
<td>{m.mark}</td>
</tr>

)
}

</tbody>

</table>

</div>

</div>

</div>

);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
